name: Build

on:
  # Tags are built by release.yml.
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texinfo wget

      - name: Cache Arm GNU Toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/bmcoco/toolchains
          key: arm-gnu-toolchain-15.2.rel1-arm-none-eabi-aarch64-none-elf

      - name: Test the emulator port on the PC
        run: tools/hostsim/run_tests.sh

      - name: Test the Pi 4 scaler and display driver on the PC
        run: |
          tools/pi4scaler/run_tests.sh
          tools/pi4kms/run_tests.sh

      - name: Build
        run: ./build_sdcard.sh

      - name: Upload SD card files
        uses: actions/upload-artifact@v7
        with:
          name: bmcoco-sdcard
          path: build/sdcard/
